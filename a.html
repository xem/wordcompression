<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JS13k - Raw Remap Testing Ground</title>
    <script src="words.js"></script>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --text: #c9d1d9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--panel); border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; background: #010409; color: #7ee787; border: 1px solid #30363d; border-radius: 6px; font-family: monospace; font-size: 11px; padding: 10px; margin-top:10px; }
        button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px; }
        .size-tag { font-weight: bold; color: var(--accent); font-size: 1.2em; }
        .mode-title { color: var(--accent); font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Raw Remap Explorer</h2>
        <p style="font-size:0.85em; color:#8b949e">On teste ici si RoadRoller compresse mieux sans l'aide du N-Prefix.</p>
        
        <div style="margin-bottom:20px;">
            <div class="mode-title">Mode 1 : Mots collés par longueur (2,3,4,5)</div>
            <button onclick="runRaw(false)">Générer Raw Collé</button>
        </div>

        <div style="margin-bottom:20px;">
            <div class="mode-title">Mode 2 : Mots avec séparateur unique ("9")</div>
            <button onclick="runRaw(true)">Générer avec Séparateur</button>
        </div>

        <div>Taille brute actuelle : <span id="eSize" class="size-tag">0</span> octets</div>
        <textarea id="encoded"></textarea>
    </div>

    <div class="card">
        <h2>Aperçu du Décodeur suggéré</h2>
        <pre id="decoderHint" style="font-size: 12px; color: #8b949e; background: #010409; padding: 10px; border-radius: 6px;"></pre>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);
    const MAP = "esaoriltnudpcmyhgbkfwvzxjq";
    const remap = (word) => [...word].map(c => String.fromCharCode(97 + MAP.indexOf(c))).join('');

    function runRaw(withSeparator) {
        let res = "";
        
        if (withSeparator) {
            // On sépare tout par "9" (le caractère après l'alphabet remappé)
            res = words.sort().map(w => remap(w)).join('9');
            
            $('decoderHint').innerText = 
                `// Décodeur avec séparateur :\n` +
                `data.split('9').map(w => [...w].map(c => MAP[c.charCodeAt(0)-97]).join(''))`;
        } else {
            // On groupe par longueur pour ne pas avoir besoin de séparateur
            let groups = {2:"", 3:"", 4:"", 5:""};
            words.forEach(w => {
                groups[w.length] += remap(w);
            });
            // On met un marqueur de section (ou on gère par longueurs fixes dans le code)
            res = groups[2] + "0" + groups[3] + "0" + groups[4] + "0" + groups[5];
            
            $('decoderHint').innerText = 
                `// Décodeur par blocs (simplifié) :\n` +
                `// Il faut boucler sur la chaîne en sautant de 2, puis 3, puis 4...`;
        }

        $('encoded').value = res;
        $('eSize').innerText = res.length;
    }
</script>
</body>
</html>

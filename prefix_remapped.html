<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JS13k - Hardcoded Remap (11345b)</title>
    <script src="words.js"></script>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --text: #c9d1d9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--panel); border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        textarea { width: 100%; height: 250px; background: #010409; color: #7ee787; border: 1px solid #30363d; border-radius: 6px; font-family: monospace; font-size: 11px; padding: 10px; }
        button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .size-tag { font-weight: bold; color: var(--accent); font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Hardcoded Remap Encoder (9=s)</h2>
        <button onclick="run()">Encoder</button>
        <div>Taille brute : <span id="eSize" class="size-tag">0</span> octets</div>
        <textarea id="encoded"></textarea>
    </div>

    <div class="card">
        <h2>Décodeur (Hardcoded)</h2>
        <button onclick="decode()" style="background:#21262d; border:1px solid #30363d;">Vérifier</button>
        <div id="dStatus" style="margin-top:10px">Prêt</div>
        <textarea id="decoded"></textarea>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);
    const getCP = (a, b) => { let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return i; };
    
    // Ton alphabet remappé
    const MAP = "esaoriltnudpcmyhgbkfwvzxjq";

    function run() {
        const remap = (word) => [...word].map(c => String.fromCharCode(97 + MAP.indexOf(c))).join('');
        const wordSet = new Set(words);
        let used = new Set();
        let finalDict = [];

        words.forEach(w => {
            if (used.has(w)) return;
            let marker = "";
            if (wordSet.has(w + 's')) {
                marker = "9";
                used.add(w + 's');
            }
            finalDict.push(remap(w) + marker);
        });

        // N-Prefix sur les mots remappés
        let res = "", prev = "";
        finalDict.sort().forEach(w => {
            let n = getCP(prev, w);
            res += n + w.slice(n);
            prev = w;
        });

        $('encoded').value = res;
        $('eSize').innerText = res.length;
    }

    function decode() {
        const data = $('encoded').value;
        const alphabet = "esaoriltnudpcmyhgbkfwvzxjq";
        let d = [], p = "";

        data.replace(/(\d)([a-z9]*)/g, (m, n, s) => {
            p = p.slice(0, n) + s;
            let root = [...p.replace('9','')].map(c => alphabet[c.charCodeAt(0)-97]).join('');
            d.push(root);
            if (p.includes('9')) d.push(root + 's');
        });

        const ok = JSON.stringify(d.sort()) === JSON.stringify([...words].sort());
        $('dStatus').innerHTML = ok ? "✅ OK" : "❌ Erreur";
        $('decoded').value = d.join(',');
    }
</script>
</body>
</html>
